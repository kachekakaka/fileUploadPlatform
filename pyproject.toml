[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "upload-platform"
version = "0.1.0"
description = "Local upload work orchestration with supervised Fake adapters"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<2.1",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "PyYAML>=6.0.2,<7",
  "tzdata>=2025.1", "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[project.scripts]
upload-platform = "upload_platform.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
